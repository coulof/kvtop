name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: 'go.mod'

    - name: Verify dependencies
      run: go mod verify

    - name: Lint
      run: go vet ./...

    - name: Test
      run: go test -v -race ./...

    - name: Build
      run: CGO_ENABLED=0 go build -v ./cmd/kvtop
